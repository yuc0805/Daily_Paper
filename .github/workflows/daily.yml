name: Daily papers

# 6:00 AM Eastern every day.
# GitHub cron is UTC-only, so two schedules cover daylight/standard time:
#   Mar-Oct (EDT, UTC-4) -> 10:00 UTC
#   Nov-Feb (EST, UTC-5) -> 11:00 UTC
on:
  schedule:
    - cron: '0 10 * 3-10 *'
    - cron: '0 11 * 11,12,1,2 *'
  workflow_dispatch:  # manual "Run workflow" button for testing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily update
        run: python scripts/daily_update.py

      - name: Commit and push
        run: |
          git config user.name "daily-paper-bot"
          git config user.email "daily-paper-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily papers $(date -u +%F) (auto)"
            git push
          fi
